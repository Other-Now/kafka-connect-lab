# Distributed worker, as the harness runs it. Exactly-once source needs every worker to enable it,
# and every sink consumer must read_committed or it will see aborted transactions.
bootstrap.servers=localhost:9092
group.id=kclab-connect
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=true
config.storage.topic=kc-configs
offset.storage.topic=kc-offsets
status.storage.topic=kc-status
config.storage.replication.factor=1
offset.storage.replication.factor=1
status.storage.replication.factor=1
offset.flush.interval.ms=10000
exactly.once.source.support=enabled
consumer.isolation.level=read_committed
scheduled.rebalance.max.delay.ms=5000
plugin.path=/opt/connect-plugins
plugin.discovery=service_load
listeners=http://localhost:8083
